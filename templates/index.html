<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Customer Churn Predictor</h1>
        <p>Predict the probability of customer churn</p>
    </div>


    <form action="/predict" method="POST">

        <div class="section">
            <h2>Customer Information</h2>

            <div class="grid">

                <!-- Gender -->
                <div class="field">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>

                <!-- Senior Citizen -->
                <div class="field">
                    <label>Senior Citizen</label>
                    <select name="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <!-- Partner -->
                <div class="field">
                    <label>Partner</label>
                    <select name="Partner">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Dependents -->
                <div class="field">
                    <label>Dependents</label>
                    <select name="Dependents">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Tenure -->
                <div class="field">
                    <label>Tenure (months)</label>
                    <input type="number"
                           name="tenure"
                           min="0"
                           max="100"
                           value="12"
                           required>
                </div>

                <!-- Phone Service -->
                <div class="field">
                    <label>Phone Service</label>
                    <select name="PhoneService">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Multiple Lines -->
                <div class="field">
                    <label>Multiple Lines</label>
                    <select name="MultipleLines">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No phone service">
                            No phone service
                        </option>
                    </select>
                </div>

                <!-- Internet Service -->
                <div class="field">
                    <label>Internet Service</label>
                    <select name="InternetService">
                        <option value="DSL">DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Online Security -->
                <div class="field">
                    <label>Online Security</label>
                    <select name="OnlineSecurity">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Online Backup -->
                <div class="field">
                    <label>Online Backup</label>
                    <select name="OnlineBackup">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Device Protection -->
                <div class="field">
                    <label>Device Protection</label>
                    <select name="DeviceProtection">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Tech Support -->
                <div class="field">
                    <label>Tech Support</label>
                    <select name="TechSupport">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Streaming TV -->
                <div class="field">
                    <label>Streaming TV</label>
                    <select name="StreamingTV">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Streaming Movies -->
                <div class="field">
                    <label>Streaming Movies</label>
                    <select name="StreamingMovies">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <!-- Contract -->
                <div class="field">
                    <label>Contract</label>
                    <select name="Contract">
                        <option value="Month-to-month">
                            Month-to-month
                        </option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <!-- Paperless Billing -->
                <div class="field">
                    <label>Paperless Billing</label>
                    <select name="PaperlessBilling">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="field">
                    <label>Payment Method</label>
                    <select name="PaymentMethod">

                        <option value="Electronic check">
                            Electronic check
                        </option>

                        <option value="Mailed check">
                            Mailed check
                        </option>

                        <option value="Bank transfer (automatic)">
                            Bank transfer (automatic)
                        </option>

                        <option value="Credit card (automatic)">
                            Credit card (automatic)
                        </option>

                    </select>
                </div>

                <!-- Monthly Charges -->
                <div class="field">
                    <label>Monthly Charges</label>
                    <input type="number"
                           name="MonthlyCharges"
                           step="0.01"
                           min="0"
                           value="70"
                           required>
                </div>

                <!-- Total Charges -->
                <div class="field">
                    <label>Total Charges</label>
                    <input type="number"
                           name="TotalCharges"
                           step="0.01"
                           min="0"
                           value="840"
                           required>
                </div>

            </div>
        </div>


        <button type="submit">
            Predict Churn
        </button>

    </form>


    {% if prediction %}

    <div class="result">

        <h2>Prediction Result</h2>

        <div class="
            {% if 'High' in prediction %}
                high-risk
            {% else %}
                low-risk
            {% endif %}
        ">

            <h3>{{ prediction }}</h3>

            <div class="probability">
                {{ probability }}%
            </div>

            <p>{{ message }}</p>

        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
